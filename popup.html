<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude RTL Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      padding: 16px;
      background: #fff;
      color: #111;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .header .icon-box {
      width: 32px;
      height: 32px;
      background: #d97757;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #d97757;
    }
    .header span {
      font-size: 12px;
      color: #888;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 0;
    }
    .toggle-row label {
      font-size: 14px;
      font-weight: 500;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      border-radius: 22px;
      transition: .2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .2s;
    }
    input:checked + .slider { background-color: #d97757; }
    input:checked + .slider:before { transform: translateX(18px); }

    .info {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      line-height: 1.5;
    }
    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      margin-right: 6px;
    }
    .status.on { background: #22c55e; }
    .status.off { background: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-box" style="font-size:20px;">&#x200F;</div>
    <div>
      <h1>Claude RTL Pro</h1>
      <span>v1.0.1</span>
    </div>
  </div>

  <div class="toggle-row">
    <label for="enableToggle">Enable RTL</label>
    <label class="toggle-switch">
      <input type="checkbox" id="enableToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="info">
    <span class="status" id="statusDot"></span>
    <span id="statusText">Loading...</span>
  </div>

  <div class="info">
    Automatically detects Arabic text in Claude responses and applies RTL direction.
    Supports mixed English/Arabic content.
  </div>

  <script src="popup.js"></script>
</body>
</html>
